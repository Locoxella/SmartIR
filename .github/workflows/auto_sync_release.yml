name: Sync Upstream & Release Custom Fork

on:
  schedule:
    # Corre automáticamente cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite ejecutar el workflow manualmente desde la pestaña Actions en GitHub

permissions:
  contents: write

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          ref: add-samsung-1409-preset-mode-support
          fetch-depth: 0

      - name: Fetch Upstream Releases
        id: check_upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_TAG=$(gh api repos/smartHomeHub/SmartIR/releases/latest --jq '.tag_name')
          echo "UPSTREAM_TAG=$UPSTREAM_TAG" >> $GITHUB_ENV
          
          # Buscar si ya existe algún release en el fork para esta versión de upstream
          LATEST_FORK_TAG=$(gh release list --repo ${{ github.repository }} --json tagName --jq ".[].tagName | select(startswith(\"${UPSTREAM_TAG}-samsung\"))" | head -n 1)
          
          if [ -z "$LATEST_FORK_TAG" ]; then
            MY_TAG="${UPSTREAM_TAG}-samsung.1"
            echo "SHOULD_RELEASE=true" >> $GITHUB_ENV
          else
            echo "Ya existe una release en el fork para $UPSTREAM_TAG ($LATEST_FORK_TAG)."
            echo "SHOULD_RELEASE=false" >> $GITHUB_ENV
            MY_TAG="$LATEST_FORK_TAG"
          fi
          echo "MY_TAG=$MY_TAG" >> $GITHUB_ENV

      - name: Sync & Merge Upstream
        if: env.SHOULD_RELEASE == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git remote add upstream https://github.com/smartHomeHub/SmartIR.git || true
          git fetch upstream master
          
          git merge upstream/master -m "Merge upstream master ($UPSTREAM_TAG) into add-samsung-1409-preset-mode-support"
          git push origin add-samsung-1409-preset-mode-support

      - name: Create Release in Fork
        if: env.SHOULD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$MY_TAG" \
            --repo "${{ github.repository }}" \
            --target add-samsung-1409-preset-mode-support \
            --title "$MY_TAG" \
            --notes "Release automática sincronizada con upstream SmartIR $UPSTREAM_TAG + soporte Samsung A/C."
